name: Go CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build, Format, Vet and Test
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Gofmt Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -d .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Test
        run: go test -v -race ./...
